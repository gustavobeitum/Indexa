<section class="contato">
    <ul>
        <li>
            <strong>{{ nome }}</strong>
        </li>
        <li>{{ telefone }}</li>
        <li>
            <button type="button" [routerLink]="['/formulario', id]">
                <img src="pencil-square.png" alt="Editar">
            </button>
            <button type="button" (click)="excluir.emit(id)">
                <img src="trash.png" alt="Excluir">
            </button>
        </li>
    </ul>
</section>
